<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Purv Taparia</title>
    <meta name="description" content="This page doesn't exist. Head back to Purv Taparia's portfolio." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/assets/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <meta name="theme-color" content="#f2eee6" />
    <script>
        (function () {
            try { if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
        })();
    </script>
    <style>
        @font-face { font-family: 'Inter Tight'; font-weight: 100 900; font-display: swap; src: url(/assets/fonts/inter-tight.woff2) format('woff2'); }
        @font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; font-display: swap; src: url(/assets/fonts/jetbrains-mono.woff2) format('woff2'); }
        :root { --bg: #f2eee6; --surface: #ffffff; --border: #141414; --text: #141414; --text2: #5c5852; --pop: #f6d43c; color-scheme: light; }
        html[data-theme="dark"] { --bg: #141414; --surface: #1e1e1e; --border: #f2eee6; --text: #f2eee6; --text2: #a39e95; color-scheme: dark; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 40px 20px; background: var(--bg); color: var(--text); font-family: 'Inter Tight', system-ui, sans-serif; text-align: center; overflow-wrap: break-word; }
        .card { max-width: 460px; width: 100%; }
        .polaroid { width: 180px; height: 180px; margin: 0 auto 34px; background: var(--pop); border: 1px solid var(--border); border-radius: 50%; display: grid; place-content: center; color: #141414; }
        .polaroid .blank { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 46px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
        .polaroid span { margin-top: 6px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
        h1 { font-size: clamp(38px, 11vw, 60px); font-weight: 800; letter-spacing: -.04em; line-height: .95; margin-bottom: 16px; text-transform: lowercase; }
        h1 em { font-style: normal; text-decoration: underline; text-decoration-color: var(--pop); text-decoration-thickness: .08em; text-underline-offset: .1em; }
        p { color: var(--text2); line-height: 1.7; margin-bottom: 28px; }
        a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; background: #141414; color: #f2eee6; border: 1px solid var(--border); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; text-decoration: none; }
        html[data-theme="dark"] a { background: #f2eee6; color: #141414; }
        a:hover { background: var(--pop); color: #141414; }
        a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    </style>
</head>

<body>
    <main class="card">
        <div class="polaroid" aria-hidden="true"><div class="blank">404</div><span>Nothing here</span></div>
        <h1>This page <em>wandered off</em></h1>
        <p>The link might be old or mistyped. Everything I've built, written and won is on the home page.</p>
        <a href="/">Back to the portfolio →</a>
    </main>
</body>

</html>
